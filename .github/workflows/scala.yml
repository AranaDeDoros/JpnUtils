name: CI / Scaladoc / Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Compile
        run: sbt compile

      - name: Generate Scaladoc
        run: sbt doc

      - name: Upload Scaladoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: scaladoc
          path: target/scala-2.13/api

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated Scaladoc
        uses: actions/download-artifact@v4
        with:
          name: scaladoc
          path: scaladoc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: scaladoc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
