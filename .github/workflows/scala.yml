name: CI / Scaladoc / Deploy

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  pages: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Test
        run: sbt test

      - name: Generate Scaladoc
        run: sbt doc

      - name: Find Scaladoc Directory
        id: find-doc
        run: |
          # Find any directory containing index.html inside target/
          DOC_DIR=$(find target -type f -name "index.html" | head -n 1 | xargs dirname)

          if [ -z "$DOC_DIR" ]; then
            echo "Error: Could not locate generated Scaladoc directory under target/"
            echo "=== Current target folder structure ==="
            find target || true
            exit 1
          fi

          echo "Found Scaladoc at: $DOC_DIR"
          echo "path=$DOC_DIR" >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-doc.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  release:
    name: Build & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Build JAR
        run: sbt package

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: target/scala-*/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}